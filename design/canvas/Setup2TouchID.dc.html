<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0D0D0D}a:hover{color:#444444}

<div style="width: 460px; height: 420px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DEDEDE; border-radius: 16px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 18px; color: #0D0D0D">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em">How often should we ask for Touch ID?</div>
    <div style="font-size: 14px; color: #676767; line-height: 1.5">Before an AI tool uses one of your keys.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F4F4F4; font-size: 14px">
      <input type="radio" name="freq" style="width: 16px; height: 16px; accent-color: #0D0D0D">
      Every time
    </label>
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F4F4F4; outline: 2px solid #0D0D0D; font-size: 14px">
      <input type="radio" name="freq" checked style="width: 16px; height: 16px; accent-color: #0D0D0D">
      <span style="flex: 1">Once every 15 minutes</span>
      <span style="font-size: 12px; color: #676767">Recommended</span>
    </label>
    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F4F4F4; font-size: 14px">
      <input type="radio" name="freq" style="width: 16px; height: 16px; accent-color: #0D0D0D">
      Once per session
    </label>
  </div>

  <div style="font-size: 12px; color: #676767">You can change this anytime, or per key.</div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #DCDCDC"></span>
      <span style="width: 18px; height: 6px; border-radius: 3px; background: #0D0D0D"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #DCDCDC"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #DCDCDC"></span>
    </div>
    <a href="Setup3Import.dc.html" style="height: 38px; padding: 0 20px; border-radius: 19px; background: #0D0D0D; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center">Continue</a>
  </div>
