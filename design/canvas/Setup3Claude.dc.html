<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Setup connect Claude Code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
a{color:#0D0D0D}a:hover{color:#444444}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 460px; height: 340px; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DEDEDE; border-radius: 16px; padding: 28px 24px 24px; display: flex; flex-direction: column; gap: 18px; color: #0D0D0D">
  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em">Connect Claude Code</div>
    <div style="font-size: 14px; color: #676767; line-height: 1.5">Claude will ask keydillo when it needs a key, instead of asking you to paste it into the chat.</div>
  </div>

  <button style="align-self: flex-start; display: flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 0; font-size: 13px; color: #444444">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    What this changes
  </button>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; gap: 6px" aria-hidden="true">
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #DCDCDC"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: #DCDCDC"></span>
      <span style="width: 18px; height: 6px; border-radius: 3px; background: #0D0D0D"></span>
    </div>
    <div style="display: flex; gap: 8px">
      <button style="height: 38px; padding: 0 16px; border-radius: 19px; border: 1px solid #DCDCDC; background: #FFFFFF; font-size: 14px">Skip</button>
      <button style="height: 38px; padding: 0 20px; border-radius: 19px; border: none; background: #0D0D0D; color: #FFFFFF; font-size: 14px; font-weight: 500">Connect</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":340}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
