name: Keydillo
options:
  bundleIdPrefix: com.studiokillswitch
  deploymentTarget:
    macOS: "15.0"
packages:
  VaultCore:
    path: ../Packages/VaultCore
  PhoneLink:
    path: ../Packages/PhoneLink
targets:
  Keydillo:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: VaultCore
      - package: PhoneLink
        product: PhoneLink
      - target: keydillo-cli
        embed: false
    postBuildScripts:
      - name: Copy CLI into Resources/bin
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin"
          # Copy then rename: overwriting a signed binary in place gets it SIGKILLed by the kernel's signature cache.
          cp "$BUILT_PRODUCTS_DIR/keydillo" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/keydillo.new"
          mv -f "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/keydillo.new" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/keydillo"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp -f "$SRCROOT/Resources/LaunchAgents/com.studiokillswitch.keydillo.agent.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
        basedOnDependencyAnalysis: false
      - name: Bundle the browser tool
        script: |
          # keydillo's browser tool (Browser/): its JavaScript, its npm dependencies and the official Node runtime.
          # Inside the bundle, the app's signature covers all of it. Skipped when Browser/ hasn't been set up
          # (npm ci && scripts/fetch-node.sh), so the app still builds without it.
          B="$SRCROOT/../Browser"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/browser"
          if [ ! -x "$B/runtime/node" ] || [ ! -d "$B/node_modules" ]; then echo "warning: browser tool not bundled (run npm ci and scripts/fetch-node.sh in Browser/)"; exit 0; fi
          mkdir -p "$DEST/server"
          rsync -a --delete "$B/src" "$B/package.json" "$B/node_modules" "$DEST/server/"
          cp "$B/runtime/node" "$DEST/node.new" && mv -f "$DEST/node.new" "$DEST/node"
          cp "$B/runtime/NODE-LICENSE" "$DEST/NODE-LICENSE"
          if [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp=none --entitlements "$SRCROOT/Resources/browser-node.entitlements" \
              --sign "$EXPANDED_CODE_SIGN_IDENTITY" --identifier com.studiokillswitch.keydillo.browser-node "$DEST/node"
          fi
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: keydillo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHumanReadableCopyright: "Open source"
    entitlements:
      path: Sources/Keydillo.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.studiokillswitch.keydillo"]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studiokillswitch.keydillo
      PRODUCT_NAME: keydillo
      PRODUCT_MODULE_NAME: KeydilloApp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      DEVELOPMENT_TEAM: 2JARAJYAYY
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "0.1.4"
      CURRENT_PROJECT_VERSION: "5"
  keydillo-cli:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - package: VaultCore
    settings:
      PRODUCT_NAME: keydillo
      PRODUCT_MODULE_NAME: KeydilloCLI
      PRODUCT_BUNDLE_IDENTIFIER: com.studiokillswitch.keydillo.cli
      SKIP_INSTALL: YES
      DEVELOPMENT_TEAM: 2JARAJYAYY
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_VERSION: "5.0"
