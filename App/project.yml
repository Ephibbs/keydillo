name: Keydillo
options:
  bundleIdPrefix: com.studiokillswitch
  deploymentTarget:
    macOS: "15.0"
packages:
  VaultCore:
    path: ../Packages/VaultCore
targets:
  Keydillo:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: VaultCore
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: keydillo
        LSUIElement: true
        NSHumanReadableCopyright: "Open source"
    entitlements:
      path: Sources/Keydillo.entitlements
      properties: {}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studiokillswitch.keydillo
      PRODUCT_NAME: keydillo
      DEVELOPMENT_TEAM: 2JARAJYAYY
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
