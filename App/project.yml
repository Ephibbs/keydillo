name: Keydillo
options:
  bundleIdPrefix: com.studiokillswitch
  deploymentTarget:
    macOS: "15.0"
packages:
  VaultCore:
    path: ../Packages/VaultCore
targets:
  Keydillo:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: VaultCore
      - target: keydillo-cli
        embed: false
    postBuildScripts:
      - name: Copy CLI into Resources/bin
        script: |
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin"
          # Copy then rename: overwriting a signed binary in place gets it SIGKILLed by the kernel's signature cache.
          cp "$BUILT_PRODUCTS_DIR/keydillo" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/keydillo.new"
          mv -f "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/keydillo.new" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Resources/bin/keydillo"
          mkdir -p "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents"
          cp -f "$SRCROOT/Resources/LaunchAgents/com.studiokillswitch.keydillo.agent.plist" "$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/LaunchAgents/"
        basedOnDependencyAnalysis: false
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: keydillo
        LSUIElement: true
        NSHumanReadableCopyright: "Open source"
    entitlements:
      path: Sources/Keydillo.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)com.studiokillswitch.keydillo"]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studiokillswitch.keydillo
      PRODUCT_NAME: keydillo
      PRODUCT_MODULE_NAME: KeydilloApp
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      DEVELOPMENT_TEAM: 2JARAJYAYY
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "1"
  keydillo-cli:
    type: tool
    platform: macOS
    sources: [CLI]
    dependencies:
      - package: VaultCore
    settings:
      PRODUCT_NAME: keydillo
      PRODUCT_MODULE_NAME: KeydilloCLI
      PRODUCT_BUNDLE_IDENTIFIER: com.studiokillswitch.keydillo.cli
      SKIP_INSTALL: YES
      DEVELOPMENT_TEAM: 2JARAJYAYY
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      SWIFT_VERSION: "5.0"
