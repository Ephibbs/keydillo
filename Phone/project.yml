name: KeydilloPhone
options:
  bundleIdPrefix: com.studiokillswitch
  deploymentTarget:
    iOS: "17.0"
packages:
  PhoneLink:
    path: ../Packages/PhoneLink
targets:
  KeydilloPhone:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    dependencies:
      - package: PhoneLink
        product: PhoneLink
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: keydillo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSCameraUsageDescription: "keydillo uses the camera to scan the pairing code your Mac shows."
        NSFaceIDUsageDescription: "Face ID approves your Mac's key requests."
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "keydillo connects straight to your Mac when it's nearby, so a browser step you're asked to do shows up live."
        NSBonjourServices: [_kd-handoff._tcp, _kd-handoff._udp]
    entitlements:
      path: Sources/KeydilloPhone.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers: ["iCloud.com.studiokillswitch.keydillo"]
        com.apple.developer.icloud-services: ["CloudKit"]
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.studiokillswitch.keydillo.phone
      PRODUCT_NAME: keydillo
      DEVELOPMENT_TEAM: 2JARAJYAYY
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1"
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "0.1.0"
      CURRENT_PROJECT_VERSION: "10"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
