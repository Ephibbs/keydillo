<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --fg: #111; --muted: #6b6b6b; --line: #e6e6e6; --fill: #f4f4f4; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --muted: #9a9a9a; --line: #2c2c2c; --fill: #1e1e1e; --bg: #141414; } }
  body { margin: 0; width: 320px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif; color: var(--fg); background: var(--bg); }
  header { padding: 14px 16px 10px; font-weight: 600; font-size: 14px; }
  .status { margin: 0 16px 12px; padding: 10px 12px; border-radius: 10px; background: var(--fill); }
  .muted { color: var(--muted); }
  h2 { font-size: 12px; font-weight: 600; margin: 4px 16px 6px; color: var(--muted); }
  ul { list-style: none; margin: 0 0 12px; padding: 0 16px; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  li div { flex: 1; min-width: 0; }
  li b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { border: 0; border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; background: var(--fg); color: var(--bg); }
  button.quiet { background: var(--fill); color: var(--fg); }
  p { margin: 0 16px 14px; }
</style>
<header>keydillo</header>
<div class="status" id="status">…</div>
<h2 id="extHead" hidden>Extensions that can read Claude's pages</h2>
<ul id="ext"></ul>
<p class="muted" id="note"></p>
<script src="popup.js" type="module"></script>
